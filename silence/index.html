<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16324f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Silence Alert">
  <title>Silence Alert</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #e7eef5;
      color: #16324f;
    }
    main {
      width: min(92vw, 420px);
      background: #fff;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(22, 50, 79, 0.12);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 22px; line-height: 1.45; color: #4d6275; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: #16324f;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; }
    .ok { color: #0d6b2c; }
    .bad { color: #a12626; }
  </style>
</head>
<body>
  <main>
    <h1>Notification Alert</h1>
    <p id="hint">After you read or reply on your phone, tap Silence to stop the PC beep.</p>
    <button id="btn" type="button">Silence alert</button>
    <p id="status" style="margin-top:16px;margin-bottom:0;"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const topic = (params.get("k") || "").replace(/[^a-zA-Z0-9_-]/g, "");
    const auto = params.get("auto") !== "0";
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const hint = document.getElementById("hint");

    async function silence() {
      if (!topic) return;
      btn.disabled = true;
      status.textContent = "Sending…";
      status.className = "";
      try {
        const response = await fetch("https://ntfy.sh/" + encodeURIComponent(topic), {
          method: "POST",
          body: "silence",
          headers: {
            "Title": "Notification Alert",
            "Priority": "min",
          },
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        status.textContent = "Silenced. The PC beep should stop.";
        status.className = "ok";
      } catch (error) {
        status.textContent = "Could not reach silence service. Try again.";
        status.className = "bad";
      } finally {
        btn.disabled = false;
      }
    }

    if (!topic) {
      hint.textContent = "Open this page from Notification Alert so your personal Silence key is included.";
      btn.disabled = true;
    } else {
      btn.onclick = silence;
      if (auto) {
        silence();
      }
    }
  </script>
</body>
</html>
